name: Test

on:
  workflow_dispatch:

  pull_request:
    types: [opened, synchronize]

  push:
    branches:
      - "main"
      - "main/**"
    paths:
      - "**.java"
      - "**.kt"
      - "gradle.properties"
      - "gradle/**"

env:
  CI: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          java-version: 26
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name != 'push' }}
          dependency-graph: generate-and-submit

      - uses: PssbleTrngle/find-release@v1
        if: ${{ github.event_name != 'pull_request' }}
        id: draft
        with:
          type: draft
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Test
        run: ./gradlew build check --stacktrace
        env:
          RELEASE_VERSION: ${{ steps.action.outputs.tag }}

      - name: Publish -SNAPSHOT version
        if: ${{ github.event_name != 'pull_request' && fromJSON(steps.draft.outputs.matched) }}
        run: ./gradlew publish
        continue-on-error: true
        env:
          RELEASE_VERSION: ${{ steps.draft.outputs.tag }}
          SNAPSHOT: true
