modLoader="lowcodefml"
loaderVersion="[1,)"
license = "https://github.com/${repository}/blob/main/1.21.x/LICENSE.md"
issueTrackerURL = "https://github.com/${repository}/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_author}"
description="${mod_description}"
updateJSONURL="https://api.modrinth.com/updates/packwiz-compatibility-check/forge_updates.json?neoforge=only"

[[dependencies.${mod_id}]]
    modId="forge"
    versionRange="[21,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    versionRange="[1.21.1,)"
    ordering="NONE"
    side="BOTH"

[[mixins]]
    config="${mod_id}.mixins.json"
